version: 2

project_name: logz

before:
  hooks:
    - go mod tidy

builds:
  - id: logz
    main: .
    binary: logz
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hermanu/logz/internal/logz.version={{.Version}}
      - -X github.com/hermanu/logz/internal/logz.commit={{.Commit}}
      - -X github.com/hermanu/logz/internal/logz.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: hermanu
    name: logz
  draft: false
  prerelease: auto
  mode: replace

dockers:
  - image_templates:
      - "ghcr.io/hermanu/logz:{{ .Version }}-amd64"
      - "ghcr.io/hermanu/logz:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/hermanu/logz"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - image_templates:
      - "ghcr.io/hermanu/logz:{{ .Version }}-arm64"
      - "ghcr.io/hermanu/logz:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/hermanu/logz"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/hermanu/logz:{{ .Version }}"
    image_templates:
      - "ghcr.io/hermanu/logz:{{ .Version }}-amd64"
      - "ghcr.io/hermanu/logz:{{ .Version }}-arm64"
  - name_template: "ghcr.io/hermanu/logz:latest"
    image_templates:
      - "ghcr.io/hermanu/logz:latest-amd64"
      - "ghcr.io/hermanu/logz:latest-arm64"
