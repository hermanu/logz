version: 2

project_name: logz

before:
  hooks:
    - go mod tidy

builds:
  - id: logz
    main: .
    binary: logz
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hermanu/logz/internal/logz.version={{.Version}}
      - -X github.com/hermanu/logz/internal/logz.commit={{.Commit}}
      - -X github.com/hermanu/logz/internal/logz.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: hermanu
    name: logz
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## logz {{ .Version }}

    See [CHANGELOG.md](https://github.com/hermanu/logz/blob/main/CHANGELOG.md) for the full history.

  footer: |
    ---

    **Install**

    ```bash
    # Go
    go install github.com/hermanu/logz@{{ .Tag }}
    ```

# Linux packages (deb / rpm / apk)
nfpms:
  - id: packages
    package_name: logz
    vendor: hermanu
    homepage: "https://github.com/hermanu/logz"
    maintainer: "hermanu <hermanu@users.noreply.github.com>"
    description: "Fast CLI for parsing, filtering, and summarizing log files"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/logz/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/logz/README.md
      - src: ./CHANGELOG.md
        dst: /usr/share/doc/logz/CHANGELOG.md

# Software Bill of Materials (SBOM)
sboms:
  - artifacts: archive