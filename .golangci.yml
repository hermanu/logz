# golangci-lint configuration
linters:
  default: fast
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - errorlint
    - exhaustive
    - nilerr
    - gocheckcompilerdirectives
    - revive
    - misspell
    - usestdlibvars
    - predeclared
    - copyloopvar
    - gocritic
    - unparam
    - gosec
    - prealloc
    - testifylint
    - paralleltest
  settings:
    govet:
      enable-all: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofumpt
    - goimports

run:
  timeout: 5m
  tests: true